[tools]
gleam = "1.16"
erlang = "29"
rebar = "3.27"

[tasks.build]
description = "Build all workspace projects in dependency order"
run = """
echo "[build] Build all projects in dependency order"
cd build_pipeline
gleam build
gleam run
cd ../dev_test
gleam build
cd ../mf2_parser
gleam build
cd ../mf2
gleam build
# cd ../core
# gleam build
cd ..
"""

[tasks.test]
description = "Run tests (and dev entrypoints) across all workspace projects"
run = """
echo "[test] Run tests across all projects"
cd build_pipeline
gleam test
gleam run
cd ../dev_test
gleam test
cd ../mf2_parser
gleam test
cd ../mf2
gleam test
# cd ../core
# gleam test
cd ..
"""

[tasks.run]
description = "Execute the build_pipeline entrypoint and rebuild dependent projects"
run = """
echo "[run] Execute build_pipeline and rebuild dependent projects"
cd build_pipeline
gleam run
cd ../dev_test
gleam build
cd ../mf2_parser
gleam build
cd ../mf2
gleam build
# cd ../core
# gleam run
cd ..
"""

[tasks.default]
description = "Default task: runs the main pipeline execution"
depends = ["run"]

[tasks.clean]
description = "Clean build artifacts across all workspace projects"
run = """
echo "[clean] Clean all workspace projects"
cd build_pipeline
gleam clean
cd ../dev_test
gleam clean
cd ../mf2_parser
gleam clean
cd ../mf2
gleam clean
# cd ../core
# gleam clean
cd ..
"""

[tasks.update]
description = "Update Gleam dependencies across all workspace projects"
run = """
echo "[update] Update dependencies across all workspace projects"
cd build_pipeline
gleam update
cd ../dev_test
gleam update
cd ../mf2_parser
gleam update
cd ../mf2
gleam update
# cd ../core
# gleam update
cd ..
"""

[tasks.format]
description = "Format Gleam source across all workspace projects"
run = """
echo "[update] Format Gleam source across all workspace projects"
cd build_pipeline
gleam format
cd ../dev_test
gleam format
cd ../mf2_parser
gleam format
cd ../mf2
gleam format
# cd ../core
# gleam format
cd ..
"""
