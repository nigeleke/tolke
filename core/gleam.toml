name = "tolke"
version = "0.0.0"

description = """
tolke turns MessageFormat 2 files into type-safe Gleam code.
It compiles messages into convenient functions, validates consistency across
locales, and supports both runtime and compile-time locale bundles.
"""

licences = ["BSD-3-Clause"]
repository = { type = "github", user = "nigeleke", repo = "tolke" }
# links = [{ title = "Website", href = "" }]

internal_modules = ["tolke/internal"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
